  const dragIdRef = useRef(null);                        // 同步镜像：drag 事件同一回合内可读
  const setDrag = useCallback((id) => { dragIdRef.current = id; setDragId(id); }, []);
  const [ghostPos, setGhostPos] = useState(null);       // 拖拽浮层位置 {x,y}
  const [dropTarget, setDropTarget] = useState({ id: null, ok: false, top: false });
  const dragRef = useRef(null);                          // { node, startX, startY, moved }
  const didDragRef = useRef(false);                      // 本次手势是否发生过拖拽（抑制 click）
  const [editNode, setEditNode] = useState(null);       // { node, isNew } 编辑/新建弹窗
  const [delNode, setDelNode] = useState(null);         // 删除确认弹窗目标
  const [versionOpen, setVersionOpen] = useState(false);
  const [templateMenu, setTemplateMenu] = useState(false);
  const [versions, setVersions] = useState([]);
  const [autoVersion, setAutoVersion] = useState(null);  // 开页自动加载的版本名（显示提示条）
  const originalRef = useRef(null);                       // 本页原始烘焙数据（用于"恢复原始数据"）
  const [toast, setToast] = useState({ msg: '', type: '', show: false });
  const [busy, setBusy] = useState('');
  const [dragOn, setDragOn] = useState(false);
  const [noticeClosed, setNoticeClosed] = useState(false);
  const [isFullscreen, setIsFullscreen] = useState(false);
  const viewportRef = useRef(null);
  const fileRef = useRef(null);
  const toastTimer = useRef(null);

  const notify = useCallback((msg, type) => {
    clearTimeout(toastTimer.current);
    setToast({ msg, type: type || '', show: true });
    toastTimer.current = setTimeout(() => setToast(t => ({ ...t, show: false })), type === 'error' ? 4200 : 2400);
  }, []);
  const commitTitle = useCallback(() => {
    setTitle(t => (String(titleDraft).trim() || t));
    setEditingTitle(false);
  }, [titleDraft]);
  // 模板菜单：点击外部关闭
  useEffect(() => {
    if (!templateMenu) return undefined;
    const onDown = (e) => { if (!(e.target.closest && e.target.closest('[data-tpl-btn], .menu'))) setTemplateMenu(false); };
    document.addEventListener('mousedown', onDown);
    return () => document.removeEventListener('mousedown', onDown);
  }, [templateMenu]);

  const mapped = !!table && !mappingError(map, table.headers);
  const built = useMemo(() => (mapped ? C.buildTree(table.rows, map, { rootName: title }) : null), [table, map, mapped]);
  const index = useMemo(() => (built ? C.indexTree(built.root) : null), [built]);
  // 聚合统计基于完整树计算，与展开层级/聚焦根无关
  const aggMap = useMemo(() => (built ? C.computeAggregates(built.root, aggregates) : new Map()), [built, aggregates]);
  const currentRoot = built ? ((rootId && index.byId.get(rootId)) || built.root) : null;

  const resetView = useCallback(() => {
    setCollapsed(new Set()); setExpanded(new Set()); setLayoutOverrides({});
    setRootId(null); setRootHistory([]); setQuery(''); setHits([]); setHitIdx(0); setNoticeClosed(false);
  }, []);

  // 应用映射并生成树
  const applyMapping = useCallback((tbl, nextMap, nextTitle, displayCfg, aggs) => {
    const m = { ...nextMap, id: nextMap.id || nextMap.primary };
    setTable(tbl);
    setMap(m);
    if (nextTitle !== undefined) setTitle(nextTitle || '组织架构树');
    // 传入数组则替换；未传入则保留现有配置并丢弃字段已不存在的项
    setAggregates(prev => C.validAggs(Array.isArray(aggs) ? aggs : prev, tbl.headers));
    setDisplay(prev => {
      if (displayCfg) return resolveDisplay(tbl.headers, m, displayCfg);
      const keep = prev.visibleFields.length > 0 && prev.visibleFields.every(h => tbl.headers.includes(h));
      const flags = { showLabels: prev.showLabels, showLayoutToggle: prev.showLayoutToggle, showButtons: prev.showButtons, showAggregates: prev.showAggregates };
      return keep ? { ...prev, visibleFields: prev.visibleFields.filter(h => h !== m.primary) } : resolveDisplay(tbl.headers, m, flags);
    });
    setSortOrder({});
    resetView();
    setDraft(null);
    setAutoVersion(null);               // 导入/重建后，开页提示条失效
  }, [resetView]);

  // 载入一个版本的数据（供自动加载与手动恢复共用，不含确认）
  const loadVersionData = useCallback((v) => {
    const rows = (v.rows || []).map(r => ({ ...r }));
    C.ensureRowIds(rows);
    const headers = v.headers || [];
    const m = { ...EMPTY_MAP, ...(v.fieldMap || {}) };
    setTable({ headers, rows, fileName: v.title || '版本' });
    setMap(m);
    setTitle(v.title || '组织架构树');
    setDisplay(prev => resolveDisplay(headers, m, { showLabels: prev.showLabels, showLayoutToggle: prev.showLayoutToggle, showButtons: prev.showButtons, showAggregates: prev.showAggregates }));
    setAggregates(prev => C.validAggs(prev, headers));
    setSortOrder({});
    resetView();
  }, [resetView]);

  // 加载表格数据：映射完整且允许时直接生成，否则打开字段设置（取消不影响当前树）
  const loadTable = useCallback((tbl, preset, extra) => {
    if (!tbl.headers.length || !tbl.rows.length) { notify('未解析到有效数据：请确认第一行为表头且至少有一行数据', 'error'); return; }
    extra = extra || {};
    const m = { ...C.autoMap(tbl.headers, tbl.rows) };
    Object.keys(preset || {}).forEach(k => { if (preset[k]) m[k] = preset[k]; });
    if (extra.maxDepth !== undefined) setMaxDepth(parseDepth(extra.maxDepth));
    if (extra.autoApply && !mappingError(m, tbl.headers)) applyMapping(tbl, m, extra.title || title, extra.displayConfig, extra.aggregates);
    else { if (extra.title) setTitle(extra.title); setDraft({ table: tbl, map: m, displayCfg: extra.displayConfig, aggs: extra.aggregates }); }
  }, [applyMapping, notify, title]);

  // 启动：优先加载最新版本，否则用烘焙数据/空模板
  const bootLoad = useCallback(() => {
    const init = window.__INITIAL_DATA__;
    const baked = (init && Array.isArray(init.aoa)) ? init : null;
    originalRef.current = baked;
    const vs = loadVersions();
    if (vs.length) {
      loadVersionData(vs[0]);
      setAutoVersion(vs[0].name);
      return;
    }
    if (baked) {
      const tbl = { ...C.normalizeTable(baked.aoa), fileName: baked.fileName || '内置数据' };
      loadTable(tbl, baked.fieldMap, { title: baked.title, maxDepth: baked.maxDepth, displayConfig: baked.displayConfig,
        aggregates: Array.isArray(baked.aggregates) ? baked.aggregates : undefined, autoApply: true });
    }
  }, [loadTable, loadVersionData]);
  // 恢复本页原始（烘焙/空）数据
  const revertToOriginal = useCallback(() => {
    setAutoVersion(null);
    const baked = originalRef.current;
    if (baked) {
      const tbl = { ...C.normalizeTable(baked.aoa), fileName: baked.fileName || '内置数据' };
      loadTable(tbl, baked.fieldMap, { title: baked.title, maxDepth: baked.maxDepth, displayConfig: baked.displayConfig,
        aggregates: Array.isArray(baked.aggregates) ? baked.aggregates : undefined, autoApply: true });
    } else { setTable(null); setMap(EMPTY_MAP); }
    notify('已恢复本页原始数据');
  }, [loadTable, notify]);

  useEffect(() => {
    document.getElementById('boot')?.remove();
    bootLoad();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);
  /* ---------- 数据导入 ---------- */
  const importFile = useCallback(async (file) => {
    if (!file) return;
    if (!/\.(xlsx|xlsm|xls|csv)$/i.test(file.name)) { notify('请选择 .xlsx / .xls / .csv 文件', 'error'); return; }
    setBusy('正在解析 Excel…');
    try {
      const XLSX = await ensureLib('xlsx');
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
      const base = file.name.replace(/\.[^.]+$/, '');
      loadTable({ ...C.normalizeTable(aoa), fileName: file.name }, null, { title: title === '组织架构树' ? base : undefined });
    } catch (e) {
      notify('Excel 解析失败：' + (e && e.message ? e.message : e), 'error');
    } finally {
      setBusy('');
      if (fileRef.current) fileRef.current.value = '';
    }
  }, [loadTable, notify, title]);
  // 示例：kind='org' 组织树（部门维度）/ 'person' 汇报树（人员汇报关系）
  const loadSample = (kind) => {
    const isPerson = kind === 'person';
    const aoa = isPerson ? C.SAMPLE_PERSON_AOA : C.SAMPLE_ORG_AOA;
    loadTable({ ...C.normalizeTable(aoa), fileName: isPerson ? '汇报树示例' : '组织树示例' }, null, {
      title: isPerson ? '示例公司 · 汇报树' : '示例公司 · 组织架构',
      autoApply: true, maxDepth: DEFAULT_DEPTH,
    });
  };
  const downloadTemplate = async (kind) => {
    const k = kind === 'person' ? 'person' : 'org';
    setTemplateMenu(false);
    setBusy('正在生成模板…');
    try {
      const XLSX = await ensureLib('xlsx');
      C.generateTemplate(XLSX, k);
      notify(k === 'person' ? '已下载汇报树模板（姓名 / 主管 …）' : '已下载组织树模板（部门 / 上级部门 …）');
    } catch (e) { notify('模板生成失败：' + e.message, 'error'); }
    finally { setBusy(''); }
  };
  const onDrop = (e) => { e.preventDefault(); setDragOn(false); importFile(e.dataTransfer.files && e.dataTransfer.files[0]); };

  /* ---------- 视图状态 ---------- */
  const view = useMemo(() => ({ maxDepth, collapsed, expanded, sortOrder }), [maxDepth, collapsed, expanded, sortOrder]);
  const scrollToNode = useCallback((id) => {
    setTimeout(() => {
      const el = viewportRef.current && viewportRef.current.querySelector(`[data-id="${id}"]`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
    }, 120);
  }, []);

  // 搜索：命中高亮 + 自动展开祖先路径（含超出深度部分）+ 定位首个命中
  useEffect(() => {
    if (!currentRoot) return undefined;
    if (!query.trim()) { setHits([]); setHitIdx(0); return undefined; }   // 清空搜索立即生效
    const t = setTimeout(() => {
      const ids = C.searchTree(currentRoot, query, map);
      setHits(ids); setHitIdx(0);
      if (!ids.length) return;
      const anc = new Set();
      ids.slice(0, 500).forEach(id => C.ancestorsOf(id, index.parentOf).forEach(a => anc.add(a)));
      setCollapsed(prev => { const n = new Set(prev); anc.forEach(a => n.delete(a)); return n; });
      setExpanded(prev => { const n = new Set(prev); anc.forEach(a => n.add(a)); return n; });
      scrollToNode(ids[0]);
    }, 250);
    return () => clearTimeout(t);
  }, [query, currentRoot, map, index, scrollToNode]);
  const matchSet = useMemo(() => new Set(hits), [hits]);
  const pathSet = useMemo(() => {
    const s = new Set(hits);
    if (index) hits.forEach(id => C.ancestorsOf(id, index.parentOf).forEach(a => s.add(a)));
    return s;
  }, [hits, index]);
  const stepHit = (dir) => {
    if (!hits.length) return;
    const i = (hitIdx + dir + hits.length) % hits.length;
    setHitIdx(i); scrollToNode(hits[i]);
  };

  /* ---------- 树交互 ---------- */
  const onSingle = useCallback((node, depth) => {
    if (query) setQuery('');                                // 搜索态下先清空搜索
    if (!node.children.length) return;
    const exceed = maxDepth != null && depth + 1 > maxDepth;
    const toggle = (set, id) => { const n = new Set(set); n.has(id) ? n.delete(id) : n.add(id); return n; };
    if (exceed) {                                           // 超出深度：局部展开/收起
      if (collapsed.has(node.id)) {
        setCollapsed(s => { const n = new Set(s); n.delete(node.id); return n; });
        setExpanded(s => new Set(s).add(node.id));
      } else setExpanded(s => toggle(s, node.id));
    } else setCollapsed(s => toggle(s, node.id));
  }, [query, maxDepth, collapsed]);
  const onDouble = useCallback((node) => {
    if (!currentRoot || node.id === currentRoot.id) return;
    setRootHistory(h => h.concat(currentRoot.id));
    setRootId(node.id);
    setCollapsed(new Set()); setExpanded(new Set()); setLayoutOverrides({}); setQuery('');
    notify(`已聚焦到「${node.virtual ? title : node.name}」，可点"返回上级"回退`);
  }, [currentRoot, notify, title]);
  const goBack = () => {
    if (!rootHistory.length) return;
    setRootId(rootHistory[rootHistory.length - 1]);
    setRootHistory(h => h.slice(0, -1));
    setCollapsed(new Set()); setExpanded(new Set());
  };
  const goRoot = () => { setRootId(null); setRootHistory([]); setCollapsed(new Set()); setExpanded(new Set()); };
  const onToggleLayout = useCallback((id, mode) => {
    setLayoutOverrides(o => ({ ...o, [id]: mode === 'horizontal' ? 'vertical' : 'horizontal' }));
  }, []);
  const onOpenSort = useCallback((id) => setSortNodeId(id), []);
  const changeDepth = (v) => { setMaxDepth(parseDepth(v)); setExpanded(new Set()); };

  /* ---------- 编辑模式 ---------- */
  // 提交新的 rows：重建树（useMemo 依赖 table），并在聚焦根失效时重置
  const commitRows = useCallback((nextRows, msg) => {
    setTable(t => ({ ...t, rows: nextRows }));
    if (msg) notify(msg);
  }, [notify]);
  // 聚焦根若被删除则回到整树根（随 built 变化校正）
  useEffect(() => {
    if (built && rootId && !index.byId.get(rootId)) { setRootId(null); setRootHistory([]); }
  }, [built, index, rootId]);

  const openAdd = useCallback((parentNode) => setEditNode({ mode: 'add', parentNode }), []);
  const openEdit = useCallback((node) => setEditNode({ mode: 'edit', node }), []);
  const openDelete = useCallback((node) => setDelNode(node), []);

  // 保存新建/编辑
  const saveNode = useCallback((vals, parentKey) => {
    if (!table) return;
    const idField = map.id || map.primary;
    const info = editNode;
    const rows = table.rows.slice();
    if (info.mode === 'add') {
      const row = { __rid: C.genRowId() };
      table.headers.forEach(h => { row[h] = vals[h] != null ? vals[h] : ''; });
      if (idField && idField !== map.primary && !String(row[idField] || '').trim()) row[idField] = C.genNodeKey(rows, idField);
      if (map.parent) row[map.parent] = parentKey || '';
      rows.push(row);
      commitRows(rows, `已新建「${vals[map.primary]}」`);
    } else {
      const rid = info.node.row.__rid;
      const next = rows.map(r => {
        if (r.__rid !== rid) return r;
        const nr = { ...r };
        table.headers.forEach(h => { if (h !== map.parent) nr[h] = vals[h] != null ? vals[h] : ''; });
        if (map.parent) nr[map.parent] = parentKey || '';
        return nr;
      });
      commitRows(next, '已保存修改');
    }
    setEditNode(null);
  }, [table, map, editNode, commitRows]);

  // 拖拽变更上级
  const reparent = useCallback((srcId, targetNode) => {
    if (!table || !index) return;
    const src = index.byId.get(srcId);
    const chk = src && C.canReparent(src, targetNode, index);
    if (!chk || !chk.ok) { if (chk) notify(chk.reason, 'error'); return; }
    const rid = src.row.__rid;
    const newKey = targetNode.virtual ? '' : targetNode.key;
    const next = table.rows.map(r => (r.__rid === rid ? { ...r, [map.parent]: newKey } : r));
    commitRows(next, `已将「${src.name}」挂到「${targetNode.virtual ? title : targetNode.name}」下`);
    setDrag(null);
  }, [table, index, map, commitRows, notify, title, setDrag]);

  // 设为顶层（上级清空）
  const reparentToTop = useCallback((srcId) => {
    if (!table || !index) return;
    const src = index.byId.get(srcId);
    if (!src || src.virtual) return;
    const pv = map.parent ? String(src.row[map.parent] || '').trim() : '';
    if (C.isRootValue(pv)) { setDrag(null); return; }
    commitRows(table.rows.map(r => (r.__rid === src.row.__rid ? { ...r, [map.parent]: '' } : r)), `已将「${src.name}」设为顶层`);
    setDrag(null);
  }, [table, index, map, commitRows, setDrag]);

  // 指针式拖拽：按住卡片移动 → 松手落到目标卡片/顶层区
  const didDrag = useCallback(() => { const v = didDragRef.current; didDragRef.current = false; return v; }, []);
  const startDrag = useCallback((node, x, y) => {
    if (!editMode) return;
    didDragRef.current = false;
    dragRef.current = { node, startX: x, startY: y, moved: false };
    const DRAG_THRESHOLD = 5;
    const hitTest = (cx, cy) => {
      const el = document.elementFromPoint(cx, cy);
      if (!el) return { id: null, ok: false, top: false };
      if (el.closest('#topDrop')) return { id: null, ok: true, top: true };
      const cardEl = el.closest('[data-node-card]');
      if (!cardEl) return { id: null, ok: false, top: false };
      const tid = cardEl.getAttribute('data-id');
      if (!tid || tid === node.id) return { id: null, ok: false, top: false };
      const tgt = index && index.byId.get(tid);
      const ok = tgt && C.canReparent(node, tgt, index).ok;
      return { id: tid, ok: !!ok, top: false };
    };
    const onMove = (e) => {
      const dr = dragRef.current;
      if (!dr) return;
      if (!dr.moved) {
        if (Math.abs(e.clientX - dr.startX) < DRAG_THRESHOLD && Math.abs(e.clientY - dr.startY) < DRAG_THRESHOLD) return;
        dr.moved = true;
        setDrag(node.id);
      }
      setGhostPos({ x: e.clientX, y: e.clientY });
      setDropTarget(hitTest(e.clientX, e.clientY));
    };
    const onUp = (e) => {
      window.removeEventListener('pointermove', onMove, true);
      window.removeEventListener('pointerup', onUp, true);
      const dr = dragRef.current;
      dragRef.current = null;
      setGhostPos(null);
      setDropTarget({ id: null, ok: false, top: false });
      if (dr && dr.moved) {
        didDragRef.current = true;                 // 抑制本次 click
        const hit = hitTest(e.clientX, e.clientY);
        if (hit.top) reparentToTop(node.id);
        else if (hit.id && hit.ok) reparent(node.id, index.byId.get(hit.id));
        else setDrag(null);
      } else {
        setDrag(null);
      }
    };
    window.addEventListener('pointermove', onMove, true);
    window.addEventListener('pointerup', onUp, true);
  }, [editMode, index, reparent, reparentToTop, setDrag]);

  // 删除：mode='subtree' 连同下级 | 'promote' 下级上移
  const confirmDelete = useCallback((mode) => {
    if (!table || !delNode) { setDelNode(null); return; }
    const node = delNode;
    const parentPv = map.parent ? String(node.row[map.parent] || '') : '';
    if (mode === 'promote') {
      const kidRids = new Set((node.children || []).map(c => c.row && c.row.__rid).filter(Boolean));
      const next = table.rows
        .filter(r => r.__rid !== node.row.__rid)
        .map(r => (kidRids.has(r.__rid) ? { ...r, [map.parent]: parentPv } : r));
      commitRows(next, `已删除「${node.name}」，下级已上移`);
    } else {
      const rids = new Set(C.subtreeRids(node));
      const next = table.rows.filter(r => !rids.has(r.__rid));
      commitRows(next, `已删除「${node.name}」及其下级`);
    }
    setDelNode(null);
  }, [table, delNode, map, commitRows]);

  // 导出当前（含改动）数据为 Excel
  const exportExcel = async () => {
    if (!table) return;
    setBusy('正在导出 Excel…');
    try {
      const XLSX = await ensureLib('xlsx');
      const aoa = [table.headers].concat(table.rows.map(r => table.headers.map(h => (r[h] == null ? '' : r[h]))));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), '人员');
      XLSX.writeFile(wb, `${safeFileName(title)}.xlsx`);
      notify('已导出 Excel（含当前改动）');
    } catch (e) { notify('导出失败：' + e.message, 'error'); }
    finally { setBusy(''); }
  };

  /* ---------- 保存版本（本地） ---------- */
  const openVersions = useCallback(() => { setVersions(loadVersions()); setVersionOpen(true); }, []);
  const saveVersion = useCallback((rawName) => {
    if (!table || !built) return;
    const name = String(rawName || '').trim() || `${title}-${new Date().toLocaleString('zh-CN')}`;
    const v = {
      id: C.genRowId(), name, savedAt: Date.now(), title,
      headers: table.headers.slice(),
      rows: table.rows.map(r => ({ ...r })),
      fieldMap: { ...map }, count: built.total,
    };
    const next = [v].concat(loadVersions());
    const res = saveVersions(next);
    if (!res.ok) { notify('保存失败：浏览器本地存储空间不足或不可用', 'error'); return; }
    setVersions(next); notify(`已保存版本「${name}」`);
  }, [table, built, title, map, notify]);
  const restoreVersion = useCallback((v) => {
    if (!v) return;
    if (!window.confirm(`恢复版本「${v.name}」将覆盖当前树（未保存的改动会丢失），继续？`)) return;
    loadVersionData(v);
    setVersionOpen(false);
    setAutoVersion(null);
    notify(`已恢复版本「${v.name}」`);
  }, [loadVersionData, notify]);
  const deleteVersion = useCallback((id) => {
    const next = loadVersions().filter(x => x.id !== id);
    saveVersions(next); setVersions(next);
  }, []);

  // 构造"上级节点"下拉选项：排除被编辑节点自身及其子孙（避免成环）
  const parentOptions = useMemo(() => {
    if (!built || !editNode || editNode.mode !== 'edit') return [];
    const exclude = new Set(C.subtreeRids(editNode.node));
    const opts = [];
    C.walk(built.root, n => { if (!n.virtual && !exclude.has(n.row && n.row.__rid)) opts.push({ key: n.key, label: n.name }); });
    return opts;
  }, [built, editNode]);
  // 生成/聚焦后把根节点水平居中
  useLayoutEffect(() => {
    const vp = viewportRef.current;
    if (!vp || !currentRoot) return;
    vp.scrollLeft = Math.max(0, (vp.scrollWidth - vp.clientWidth) / 2);
    vp.scrollTop = 0;
  }, [currentRoot, built]);

  // 拖拽空白区平移画布（原生滚动，不用 transform）
  useEffect(() => {
    const vp = viewportRef.current;
    if (!vp) return undefined;
    let st = null;
    const down = (e) => {
      if (e.button !== 0 || e.target.closest('[data-node-card], button, input, select, textarea, a, label')) return;
      st = { x: e.clientX, y: e.clientY, l: vp.scrollLeft, t: vp.scrollTop, id: e.pointerId };
      vp.setPointerCapture(e.pointerId);
      vp.classList.add('is-panning');
    };
    const move = (e) => {
      if (!st) return;
      vp.scrollLeft = st.l - (e.clientX - st.x);
      vp.scrollTop = st.t - (e.clientY - st.y);
    };
    const up = () => {
      if (!st) return;
      try { vp.releasePointerCapture(st.id); } catch (_) { /* 已释放 */ }
      st = null;
      vp.classList.remove('is-panning');
    };
    vp.addEventListener('pointerdown', down);
    vp.addEventListener('pointermove', move);
    vp.addEventListener('pointerup', up);
    vp.addEventListener('pointercancel', up);
    return () => {
      vp.removeEventListener('pointerdown', down); vp.removeEventListener('pointermove', move);
      vp.removeEventListener('pointerup', up); vp.removeEventListener('pointercancel', up);
    };
  }, [!!built]);

  useEffect(() => {
    const onFs = () => setIsFullscreen(!!document.fullscreenElement);
    document.addEventListener('fullscreenchange', onFs);
    return () => document.removeEventListener('fullscreenchange', onFs);
  }, []);
  const toggleFullscreen = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => notify('浏览器不允许全屏', 'error'));
  };

  /* ---------- 导出 ---------- */
  const metasOf = useCallback((node) => display.visibleFields
    .map(f => [f, node.row[f]])
    .filter(([, v]) => v !== undefined && v !== null && String(v) !== '')
    .map(([f, v]) => (display.showLabels ? `${f}：${v}` : String(v)))
    .concat(display.showAggregates ? (aggMap.get(node.id) || []).map(r => `${r.label} ${r.text}`) : []), [display, aggMap]);
  const exportPpt = () => {
    if (!currentRoot) return;
    try {
      const vt = C.visibleTree(currentRoot, { ...view, rootName: title }, metasOf);
      const bytes = C.buildPptx(vt, { title });
      downloadBlob(new Blob([bytes], { type: C.MIME_PPTX }), `${safeFileName(title)}.pptx`);
      notify('PPT 已导出（按当前可见节点生成）');
    } catch (e) { notify('PPT 导出失败：' + e.message, 'error'); }
  };
  const exportPng = async () => {
    const stage = viewportRef.current && viewportRef.current.querySelector('.tree-stage');
    if (!stage) return;
    setBusy('正在生成图片…');
    try {
      const h2c = await ensureLib('html2canvas');
      const w = stage.scrollWidth, h = stage.scrollHeight;
      const canvas = await h2c(stage, {
        backgroundColor: '#eef2f6', scale: Math.min(2, 16000 / Math.max(w, h, 1)),
        width: w, height: h, windowWidth: w + 120, windowHeight: h + 120, scrollX: 0, scrollY: 0,
        onclone: (doc) => {
          doc.documentElement.style.overflow = 'visible'; doc.body.style.overflow = 'visible';
          const app = doc.querySelector('.app'); if (app) { app.style.height = 'auto'; app.style.overflow = 'visible'; }
          const ws = doc.querySelector('.workspace'); if (ws) ws.style.overflow = 'visible';
          const vp = doc.querySelector('.tree-viewport'); if (vp) { vp.style.position = 'static'; vp.style.overflow = 'visible'; }
        },
      });
      await new Promise((res, rej) => canvas.toBlob(b => (b ? (downloadBlob(b, `${safeFileName(title)}.png`), res()) : rej(new Error('图片过大'))), 'image/png'));
      notify('图片已导出');
    } catch (e) { notify('图片导出失败：' + (e && e.message ? e.message : e), 'error'); }
    finally { setBusy(''); }
  };
  /* ---------- 渲染 ---------- */
  const edit = useMemo(() => ({
    index, dragId, startDrag, didDrag,
    dropTargetId: dropTarget.id, dropOk: dropTarget.ok,
    onAdd: openAdd, onEdit: openEdit, onDelete: openDelete, onReparent: reparent,
  }), [index, dragId, startDrag, didDrag, dropTarget, openAdd, openEdit, openDelete, reparent]);
  const ctx = useMemo(() => ({
    view, layoutOverrides, display, map, matchSet, pathSet, query, rootName: title, aggMap,
    currentHit: hits.length ? hits[hitIdx] : null,
    onSingle, onDouble, onToggleLayout, onOpenSort,
    editMode, edit,
  }), [view, layoutOverrides, display, map, matchSet, pathSet, query, title, aggMap, hits, hitIdx, onSingle, onDouble, onToggleLayout, onOpenSort, editMode, edit]);

  const w = built ? built.warnings : null;
  const short = (arr) => arr.slice(0, 5).join('、') + (arr.length > 5 ? ` 等 ${arr.length} 个` : '');
  const notices = w ? [
    w.cycles.length && `检测到循环引用，已在「${short(w.cycles)}」处断开并提升为顶层节点`,
    w.selfRefs.length && `上级是自己：${short(w.selfRefs)}`,
    w.duplicates.length && `节点标识重复：${short(w.duplicates)}（下级会挂到第一个同名节点，建议把"节点标识列"设为工号）`,
    w.orphans.length > 1 && `${w.orphans.length} 个节点的上级未在表中找到，已作为顶层节点`,
  ].filter(Boolean) : [];
  const depthLevels = index ? index.maxDepth + (built.root.virtual ? 0 : 1) : 0;
  const sortNode = sortNodeId && index ? index.byId.get(sortNodeId) : null;
  useEffect(() => { document.title = title; }, [title]);

  return (
    <div className={`app ${editMode ? 'is-edit' : ''}`}>
      <header className="topbar">
        <div className="topbar-inner">
          <div className="title-row">
            {editingTitle ? (
              <input className="title-input" value={titleDraft} autoFocus aria-label="编辑标题"
                onChange={(e) => setTitleDraft(e.target.value)}
                onBlur={commitTitle}
                onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); commitTitle(); } if (e.key === 'Escape') setEditingTitle(false); }} />
            ) : (
              <h1 className="title-edit" title="点击修改标题" tabIndex={0}
                onClick={() => { setTitleDraft(title); setEditingTitle(true); }}
                onKeyDown={(e) => { if (e.key === 'Enter') { setTitleDraft(title); setEditingTitle(true); } }}>
                {title}<Icon name="edit" size={13} />
              </h1>
            )}
            {built && (
              <div className="stats">
                <span className="stat">节点<strong>{built.total}</strong></span>
                <span className="stat">层级<strong>{depthLevels}</strong></span>
                {currentRoot !== built.root && <span className="root-chip" title={currentRoot.name}>当前根：{currentRoot.name}</span>}
              </div>
            )}
          </div>
          <div className="controls-row">
            <div className="ctl-group">
              <input ref={fileRef} type="file" accept=".xlsx,.xlsm,.xls,.csv" hidden onChange={(e) => importFile(e.target.files[0])} />
              <button type="button" className="btn primary" onClick={() => fileRef.current.click()}><Icon name="upload" />导入 Excel</button>
              <button type="button" className="btn" disabled={!table} onClick={() => setDraft({ table, map: { ...map }, displayCfg: null })}><Icon name="sliders" />字段设置</button>
              <span className="popover-anchor">
                <button type="button" className="btn" data-display-btn="1" disabled={!built} aria-expanded={showDisplay} onClick={() => setShowDisplay(v => !v)}><Icon name="eye" />显示设置</button>
                {showDisplay && built && <DisplayPanel headers={table.headers} map={map} display={display} aggCount={aggregates.length} onChange={setDisplay} onClose={() => setShowDisplay(false)} />}
              </span>
            </div>
            <span className="ctl-sep" />
            <div className="ctl-group">
              <span className="ctl-label">展示层级</span>
              <select className="control" aria-label="最大展示深度" value={maxDepth == null ? 'all' : String(maxDepth)} onChange={(e) => changeDepth(e.target.value)}>
                {DEPTH_OPTIONS.map(d => <option key={d} value={String(d)}>展开 {d} 层</option>)}
                <option value="all">全部展开</option>
              </select>
            </div>
            <div className="ctl-group">
              <div className="search-wrap">
                <Icon name="search" />
                <input className="search-input" placeholder="搜索名称 / 层级 / 部门" value={query} disabled={!built} aria-label="搜索节点"
                  onChange={(e) => setQuery(e.target.value)}
                  onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); stepHit(e.shiftKey ? -1 : 1); } if (e.key === 'Escape') setQuery(''); }} />
                {query && <button type="button" className="search-clear" onClick={() => setQuery('')} aria-label="清空搜索"><Icon name="x" size={12} /></button>}
              </div>
              {query.trim() && <span className={`search-count ${hits.length ? '' : 'miss'}`} aria-live="polite">{hits.length ? `${hitIdx + 1} / ${hits.length}` : '无匹配'}</span>}
            </div>
            <span className="ctl-sep" />
            <div className="ctl-group">
              <button type="button" className="btn" disabled={!rootHistory.length} onClick={goBack}><Icon name="back" />返回上级</button>
              <button type="button" className="btn" disabled={!built || currentRoot === built.root} onClick={goRoot}><Icon name="home" />回到根</button>
              <button type="button" className="btn" onClick={toggleFullscreen}><Icon name={isFullscreen ? 'minimize' : 'maximize'} />{isFullscreen ? '退出全屏' : '全屏'}</button>
            </div>
            <span className="ctl-sep" />
            <div className="ctl-group">
              <span className="popover-anchor">
                <button type="button" className="btn" data-tpl-btn="1" aria-expanded={templateMenu} onClick={() => setTemplateMenu(v => !v)}>
                  <Icon name="sheet" />下载模板<Icon name="chev" size={12} />
                </button>
                {templateMenu && (
                  <div className="menu" role="menu">
                    <button type="button" role="menuitem" onClick={() => downloadTemplate('org')}>
                      <b>组织树模板</b><span>部门 / 上级部门 / 组织负责人 / 职级 / 下级人数</span>
                    </button>
                    <button type="button" role="menuitem" onClick={() => downloadTemplate('person')}>
                      <b>汇报树模板</b><span>姓名 / 主管 / 职级 / 部门 / 岗位 / 工号</span>
                    </button>
                    <div className="menu-sep" />
                    <button type="button" role="menuitem" onClick={() => { setTemplateMenu(false); loadSample('org'); }}>
                      <b>查看组织树示例</b><span>用部门维度示例数据替换当前页面</span>
                    </button>
                    <button type="button" role="menuitem" onClick={() => { setTemplateMenu(false); loadSample('person'); }}>
                      <b>查看汇报树示例</b><span>用人员汇报关系示例数据替换当前页面</span>
                    </button>
                  </div>
                )}
              </span>
            </div>
            <span className="ctl-sep" />
            <div className="ctl-group">
              <button type="button" className={`btn ${editMode ? 'is-on' : ''}`} disabled={!built} aria-pressed={editMode}
                onClick={() => { setEditMode(v => !v); setDrag(null); setQuery(''); }}>
                <Icon name="edit" />{editMode ? '退出编辑' : '编辑'}
              </button>
              {editMode && <button type="button" className="btn" disabled={!built} onClick={exportExcel}><Icon name="sheet" />导出 Excel</button>}
              <button type="button" className="btn" disabled={!built} onClick={openVersions}><Icon name="layers" />版本</button>
            </div>
            <span className="ctl-sep" />
            <div className="ctl-group">
              <button type="button" className="btn" disabled={!built} onClick={exportPpt}><Icon name="ppt" />导出 PPT</button>
              <button type="button" className="btn" disabled={!built} onClick={exportPng}><Icon name="image" />导出 PNG</button>
            </div>
          </div>
          {built && !editMode && <div className="help-tip">单击节点展开/折叠 · 双击以该节点为根聚焦 · 拖拽空白处平移 · 搜索框回车跳到下一个命中</div>}
        </div>
      </header>
      <div className="subbar">
        {autoVersion && built && (
          <div className="ver-banner" role="status">
            <Icon name="layers" size={13} /><span>已加载最新版本「{autoVersion}」</span>
            <button type="button" className="link" onClick={revertToOriginal}>恢复原始数据</button>
            <button type="button" className="x" onClick={() => setAutoVersion(null)} aria-label="关闭提示"><Icon name="x" size={12} /></button>
          </div>
        )}
        {editMode && built && (
          <div className="edit-tip" role="status">
            <Icon name="edit" size={13} />编辑模式：拖动卡片变更上级 · 卡片右上角 ＋ 新建下级 / ✎ 编辑 / 🗑 删除 · 改动请"导出 Excel"保存
          </div>
        )}
        {notices.length > 0 && !noticeClosed && (
          <div className="notice" role="status">
            <Icon name="alert" /><span>{notices.join('；')}</span>
            <button type="button" onClick={() => setNoticeClosed(true)}>知道了</button>
          </div>
        )}
      </div>

      <main className="workspace">
        {built ? (
          <section className="tree-viewport" ref={viewportRef} aria-label="架构树画布">
            <div className="tree-stage">
              {editMode && dragId && !((index && index.byId.get(dragId)) || {}).virtual && (
                <div className={`top-drop ${dropTarget.top ? 'drop-ok' : ''}`} id="topDrop">
                  拖到此处：设为顶层节点
                </div>
              )}
              <TreeCtx.Provider value={ctx}>
                <ul className="tree" role="tree" aria-label={title}>
                  <TreeBranch key={currentRoot.id} node={currentRoot} depth={0} isRoot isInCompactLane={false} />
                </ul>
              </TreeCtx.Provider>
            </div>
          </section>
        ) : (
          <div className="empty">
            <div className={`empty-card ${dragOn ? 'drag-on' : ''}`}
              onDragOver={(e) => { e.preventDefault(); setDragOn(true); }} onDragLeave={() => setDragOn(false)} onDrop={onDrop}>
              <h2>导入 Excel 生成架构树</h2>
              <p>把 Excel 文件拖到这里，或点击下方按钮选择文件（读取第一个工作表，第一行为表头）。</p>
              <ol>
                <li>每行一个节点，需有<b>主字段</b>（组织树填"部门"，汇报树填"姓名"）和<b>上级字段</b>（如 上级部门 / 主管）。</li>
                <li>上级字段的值要能在主字段（或你指定的标识列，如工号）中找到；为空即顶层节点。</li>
                <li>导入后在"字段设置"确认映射，在"显示设置"选择节点上展示的字段。</li>
              </ol>
              <div className="empty-actions">
                <button type="button" className="btn primary lg" onClick={() => fileRef.current.click()}><Icon name="upload" />选择 Excel</button>
              </div>
              <div className="empty-actions" style={{ marginTop: 10 }}>
                <button type="button" className="btn ghost lg" onClick={() => loadSample('org')}><Icon name="layers" />组织树示例</button>
                <button type="button" className="btn ghost lg" onClick={() => loadSample('person')}><Icon name="layers" />汇报树示例</button>
              </div>
              <div className="empty-actions" style={{ marginTop: 10 }}>
                <button type="button" className="btn ghost lg" onClick={() => downloadTemplate('org')}><Icon name="sheet" />组织树模板</button>
                <button type="button" className="btn ghost lg" onClick={() => downloadTemplate('person')}><Icon name="sheet" />汇报树模板</button>
              </div>
            </div>
          </div>
        )}
      </main>

      {draft && (
        <FieldMappingModal table={draft.table} initial={{ ...EMPTY_MAP, ...draft.map, id: draft.map.id === draft.map.primary ? '' : (draft.map.id || '') }} title={title}
          initialAggs={Array.isArray(draft.aggs) ? draft.aggs : aggregates}
          onCancel={() => setDraft(null)}
          onConfirm={(m, name, aggs) => applyMapping(draft.table, m, name, draft.displayCfg || undefined, aggs)} />
      )}
      {sortNode && (
        <SortModal node={sortNode} order={sortOrder[sortNode.id]} onCancel={() => setSortNodeId(null)}
          onConfirm={(ids) => { setSortOrder(o => ({ ...o, [sortNode.id]: ids })); setSortNodeId(null); notify('已更新子节点顺序'); }} />
      )}
      {editNode && table && (
        <NodeEditModal
          node={editNode.mode === 'edit' ? editNode.node
            : { name: '', row: map.parent ? { [map.parent]: (editNode.parentNode && !editNode.parentNode.virtual ? editNode.parentNode.key : '') } : {}, children: [] }}
          headers={table.headers} map={map}
          isNew={editNode.mode === 'add'}
          parentOptions={(() => {
            const base = [];
            if (built) C.walk(built.root, n => { if (!n.virtual) base.push(n); });
            if (editNode.mode === 'edit') {
              const ex = new Set(C.subtreeRids(editNode.node));
              return base.filter(n => !ex.has(n.row && n.row.__rid)).map(n => ({ key: n.key, label: n.name }));
            }
            return base.map(n => ({ key: n.key, label: n.name }));
          })()}
          onCancel={() => setEditNode(null)}
          onConfirm={(vals, parentKey) => saveNode(vals, parentKey)}
        />
      )}
      {delNode && (
        <DeleteModal node={delNode}
          childCount={delNode.children ? delNode.children.length : 0}
          descCount={Math.max(0, C.subtreeRids(delNode).length - 1)}
          onCancel={() => setDelNode(null)} onConfirm={confirmDelete} />
      )}
      {versionOpen && (
        <VersionModal versions={versions} defaultName={`${title}-${new Date().toLocaleString('zh-CN')}`}
          onClose={() => setVersionOpen(false)} onSave={saveVersion} onRestore={restoreVersion} onDelete={deleteVersion} />
      )}
      {busy && <div className="busy" role="status">{busy}</div>}
      {ghostPos && dragId && index && index.byId.get(dragId) && (
        <div className="drag-ghost" style={{ left: ghostPos.x + 12, top: ghostPos.y + 12 }}>{index.byId.get(dragId).name}</div>
      )}
      <div className={`toast ${toast.show ? 'show' : ''} ${toast.type}`} role="status" aria-live="polite">{toast.msg}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
/* 启动器：按顺序加载 React / ReactDOM / Babel（jsdelivr 失败自动切 unpkg），再编译执行 #app-src。
 * Excel 解析（xlsx）与 PNG 导出（html2canvas）在首次使用时才加载。 */
(function () {
  var J = 'https://cdn.jsdelivr.net/npm/', U = 'https://unpkg.com/';
  var both = function (p) { return [J + p, U + p]; };
  var BOOT = [
    both('react@18.3.1/umd/react.production.min.js'),
    both('react-dom@18.3.1/umd/react-dom.production.min.js'),
    both('@babel/standalone@7.24.7/babel.min.js'),
  ];
  window.__LIBS__ = {
    xlsx: both('xlsx@0.18.5/dist/xlsx.full.min.js'),
    html2canvas: both('html2canvas@1.4.1/dist/html2canvas.min.js'),
  };
  window.__loadScript = function (urls) {
    return new Promise(function (resolve, reject) {
      var i = 0;
      (function next() {
        if (i >= urls.length) { reject(new Error('无法加载脚本：' + urls[0])); return; }
        var s = document.createElement('script');
        s.src = urls[i++];
        s.onload = function () { resolve(); };
        s.onerror = function () { s.remove(); next(); };
        document.head.appendChild(s);
      })();
    });
  };
  function fail(title, detail) {
    var el = document.getElementById('boot');
    if (!el) { el = document.createElement('div'); el.id = 'boot'; document.body.appendChild(el); }
    el.className = 'boot boot-error';
    el.innerHTML = '';
    var box = document.createElement('div');
    var h = document.createElement('div'); h.textContent = title; box.appendChild(h);
    if (detail) { var pre = document.createElement('pre'); pre.textContent = detail; box.appendChild(pre); }
    el.appendChild(box);
  }
  window.addEventListener('error', function (e) { if (!document.querySelector('.app')) fail('页面运行出错', String(e.message || e)); });
  BOOT.reduce(function (p, urls) { return p.then(function () { return window.__loadScript(urls); }); }, Promise.resolve())
    .then(function () {
      var code;
      try {
        code = Babel.transform(document.getElementById('app-src').textContent, { presets: ['react'], sourceType: 'script' }).code;
      } catch (e) { fail('应用代码编译失败', e.message); return; }
      try { (0, eval)(code); } catch (e) { fail('应用启动失败', e.stack || e.message); }
    })
    .catch(function (e) {
      fail('依赖加载失败：请确认可以访问 cdn.jsdelivr.net 或 unpkg.com', e.message +
        '\n离线/内网环境的处理方式见 skill 文档 references/data-format.md 「离线使用」。');
    });
})();
</script>
</body>
</html>
