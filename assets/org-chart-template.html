<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>组织架构树</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
:root{--canvas:#eef2f6;--surface:#fcfdfe;--surface-2:#f5f8fb;--ink:#1c2533;--muted:#5b6878;--line:#c5d0dc;--line-strong:#a7b5c4;--primary:#2f9e5b;--blue:#3b6fd8;--teal:#0c8599;--danger:#c92a2a;--amber:#f59f00;--shadow:0 2px 8px rgba(30,42,56,.12);--radius:8px;color-scheme:light}
body{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;color:var(--ink);background:var(--canvas);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,.node-card:focus-visible{outline:3px solid rgba(59,111,216,.42);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
.boot{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;padding:24px;text-align:center}
.boot-error{color:var(--danger)}
.boot-error pre{margin-top:12px;max-width:720px;white-space:pre-wrap;text-align:left;font-size:12px;background:#fff;border:1px solid #f1c4b3;border-radius:8px;padding:12px;color:var(--ink)}
.icon{width:14px;height:14px;flex:none}
.app{height:100vh;display:grid;grid-template-rows:auto auto 1fr;overflow:hidden}
.topbar{position:relative;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1600px;margin:0 auto;padding:8px 16px}
.title-row{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.title-row h1{font-size:15px;font-weight:760;white-space:nowrap}
.title-edit{display:inline-flex;align-items:center;gap:5px;cursor:pointer;border-radius:6px;padding:2px 8px}
.title-edit .icon{opacity:.35;flex:none}
.title-edit:hover{background:var(--surface-2)}
.title-edit:hover .icon{opacity:.8;color:var(--teal)}
.title-input{font-size:15px;font-weight:760;text-align:center;height:28px;border:1px solid var(--teal);border-radius:6px;padding:0 8px;min-width:220px;max-width:70vw;background:#fff}
.stats{display:flex;gap:12px;color:var(--muted);font-size:12px;align-items:center;flex-wrap:wrap}
.stat strong{color:var(--ink);font-weight:760;margin-left:3px}
.root-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:#e6f4f6;color:var(--teal);font-size:12px;font-weight:600;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.controls-row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 8px;margin-top:6px;background:#f6f8fa;border-radius:8px;padding:8px 12px}
.ctl-group{display:flex;align-items:center;gap:6px}
.ctl-sep{width:1px;height:18px;background:var(--line);margin:0 2px}
.ctl-label{font-size:12px;color:var(--muted)}
.control,.search-input{height:26px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--ink);padding:0 8px;font-size:12px}
.control{min-width:92px}
.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap>.icon{position:absolute;left:7px;color:var(--muted);pointer-events:none}
.search-input{width:220px;padding-left:26px;padding-right:26px}
.search-clear{position:absolute;right:4px;width:18px;height:18px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.search-clear:hover{background:#e8eef5;color:var(--ink)}
.search-count{font-size:12px;color:var(--muted);min-width:58px}
.search-count.miss{color:var(--danger)}
.btn{height:26px;border:1px solid #b0c4d8;border-radius:6px;background:#f0f5fa;color:#3a5a76;padding:0 9px;font-weight:500;display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;white-space:nowrap;transition:background 160ms ease,color 160ms ease}
.btn:hover{background:#dde8f2;color:#1e3a56}
.btn:active{opacity:.85}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:#0a7285}
.btn.ghost{background:#fff;border-color:var(--line-strong);color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:#f1f5f9}
.btn.lg{height:34px;padding:0 16px;font-size:13px;border-radius:8px}
.notice{display:flex;align-items:center;gap:8px;justify-content:center;padding:6px 16px;font-size:12px;background:#fff8e6;color:#8a5a00;border-bottom:1px solid #f5dfa6}
.notice button{margin-left:8px;border:0;background:transparent;color:inherit;cursor:pointer;text-decoration:underline;font-size:12px}
.popover-anchor{position:relative}
.popover{position:absolute;top:calc(100% + 6px);left:0;z-index:40;width:270px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(30,42,56,.18);padding:12px;text-align:left}
.menu{position:absolute;top:calc(100% + 6px);left:0;z-index:40;width:270px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(30,42,56,.18);padding:6px;text-align:left}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:7px;padding:9px 10px;cursor:pointer;font:inherit}
.menu button:hover{background:var(--surface-2)}
.menu button b{display:block;font-size:13px;color:var(--ink);font-weight:600}
.menu button span{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.menu-sep{height:1px;background:#edf1f5;margin:6px 4px}
.popover h3{font-size:12px;color:var(--muted);font-weight:600;margin:2px 0 6px}.popover .hint{font-size:11px;color:var(--muted);margin-top:8px}
.check{display:flex;align-items:center;gap:8px;padding:4px 4px;font-size:13px;cursor:pointer;border-radius:4px}
.check:hover{background:var(--surface-2)}
.check input{accent-color:var(--teal)}
.check.disabled{cursor:default;color:var(--muted)}
.check .tag{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:999px;background:#e6f4f6;color:var(--teal)}
.field-list{max-height:260px;overflow:auto;border-bottom:1px solid #edf1f5;padding-bottom:6px;margin-bottom:6px}
.workspace{position:relative;overflow:hidden;min-height:0}
.tree-viewport{position:absolute;inset:0;overflow:auto;padding:48px 28px 120px;cursor:grab;overscroll-behavior:contain}
.tree-viewport.is-panning{cursor:grabbing;user-select:none}
.tree-stage{min-width:100%;width:max-content;display:flex;justify-content:center}
.tree,.tree ul{list-style:none;text-align:center;position:relative}
.tree ul{display:flex;justify-content:center;padding-top:18px}
.tree li{position:relative;padding:0 10px;display:flex;flex-direction:column;align-items:center}
.tree li::before,.tree li::after{content:"";position:absolute;top:-9px;width:50%;height:9px;border-top:1px solid var(--line)}
.tree li::before{right:50%}
.tree li::after{left:50%;border-left:1px solid var(--line)}
.tree li:first-child::before{border-top:0}
.tree li:last-child::after{border-top:0}
.tree li:only-child::before{display:none}
.tree li:only-child::after{border-top:0}
.tree ul::before{content:"";position:absolute;top:0;left:50%;height:9px;border-left:1px solid var(--line)}
.tree>li::before,.tree>li::after{display:none}
.compact-lane{width:max-content;min-width:168px;margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:10px;background:rgba(245,248,251,.72);display:flex;flex-direction:column;align-items:stretch;gap:6px;position:relative}
.compact-lane::before{content:"";position:absolute;top:-9px;left:50%;height:8px;border-left:1px solid var(--line)}
.compact-lane li{padding:0;align-items:center;display:flex;flex-direction:column}
.compact-lane li::before,.compact-lane li::after{display:none}
.compact-lane .compact-lane{border:none;border-left:2px solid var(--line);margin-left:12px;margin-top:4px;padding:4px 0 2px 10px;min-width:160px;background:transparent;border-radius:0}
.compact-lane .compact-lane::before{display:none}
.compact-lane .node-card{box-shadow:none}
.compact-lane.compact-two-cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;align-items:start}
.compact-lane.compact-two-cols>li{width:100%}
.node-card{width:158px;min-height:46px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);padding:10px 8px 8px;cursor:pointer;text-align:center;position:relative;transition:border-color 160ms ease,background 160ms ease,transform 160ms ease,opacity 160ms ease;user-select:none}
.node-card:hover{border-color:#8fb3c9;transform:translateY(-1px)}
.node-card.is-root{border:1.5px solid var(--ink)}
.node-card.is-virtual{border-style:dashed;background:var(--surface-2)}
.node-card.has-collapsed-children{border-bottom:2.5px solid var(--teal)}
.node-card.is-match{border-color:var(--primary);box-shadow:0 0 0 3px rgba(47,158,91,.28);background:#f0faf3}
.node-card.is-current{box-shadow:0 0 0 3px rgba(47,158,91,.35),0 0 0 6px rgba(245,159,0,.45)}
.node-card.is-dimmed{opacity:.32}
.node-name{font-weight:700;font-size:13px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--teal)}
.node-card mark{background:#ffe066;color:inherit;border-radius:2px;padding:0 1px}
.node-field{color:var(--muted);font-size:11px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node-field .lbl{color:#8a96a3}
.collapse-bar{display:flex;align-items:center;justify-content:center;gap:3px;margin:7px -8px -8px;height:18px;font-size:10.5px;color:var(--teal);background:#e8f5f7;border-top:1px dashed #a9d6dd;border-radius:0 0 7px 7px}
.node-card:hover .collapse-bar{background:#d5eef2}
.card-btn{position:absolute;right:-9px;width:20px;height:20px;border:1px solid var(--line-strong);border-radius:50%;background:#fff;color:var(--muted);display:grid;place-items:center;z-index:5;cursor:pointer;padding:0;transition:all 160ms ease}
.card-btn:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.card-btn .icon{width:11px;height:11px}
/* 编辑模式 */
.btn.is-on{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.is-on:hover{filter:brightness(1.05);background:var(--amber);color:#fff}
.edit-tip{display:flex;align-items:center;gap:8px;justify-content:center;padding:6px 16px;font-size:12px;background:#fff4e6;color:#a05a00;border-bottom:1px solid #ffd8a8}
.app.is-edit .node-card{cursor:grab}
.app.is-edit .node-card.is-dimmed{pointer-events:auto}
.node-card.is-drag{opacity:.4}
.node-card.drop-ok{outline:2px dashed var(--primary);outline-offset:2px;background:#eefaf1}
.node-card.drop-bad{outline:2px dashed var(--danger);outline-offset:2px}
.edit-acts{position:absolute;top:-11px;right:-8px;display:flex;gap:3px;z-index:6}
.edit-act{width:21px;height:21px;border:1px solid var(--line-strong);border-radius:50%;background:#fff;color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0;transition:all 140ms ease}
.edit-act .icon{width:12px;height:12px}
.edit-act.add:hover{background:var(--primary);border-color:var(--primary);color:#fff}
.edit-act.edit:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.edit-act.del:hover{background:var(--danger);border-color:var(--danger);color:#fff}
.top-drop{margin:0 auto 14px;max-width:420px;padding:10px;border:2px dashed var(--line-strong);border-radius:10px;text-align:center;font-size:12px;color:var(--muted);background:#fafcfe}
.top-drop.drop-ok{border-color:var(--primary);color:var(--primary);background:#eefaf1}
.del-choice{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.del-opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.del-opt:hover{border-color:var(--line-strong);background:var(--surface-2)}
.del-opt input{margin-top:2px;accent-color:var(--teal)}
.del-opt .t{font-weight:600;font-size:13px}
.del-opt .d{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5}
.drag-ghost{position:fixed;z-index:300;pointer-events:none;background:#fff;border:2px solid var(--teal);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--teal);box-shadow:0 8px 24px rgba(20,28,40,.22);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ver-save{display:flex;gap:8px;margin-bottom:12px}
.ver-save input{flex:1;height:34px;border:1px solid var(--line-strong);border-radius:6px;padding:0 10px;font-size:13px}
.ver-list{list-style:none;display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
.ver-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:8px}
.ver-item .meta{flex:1;min-width:0}
.ver-item .nm{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ver-item .sub{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ver-empty{text-align:center;color:var(--muted);font-size:13px;padding:24px 0}
.ver-banner{display:flex;align-items:center;gap:8px;justify-content:center;padding:6px 16px;font-size:12px;background:#e6f4f6;color:#0a6b7a;border-bottom:1px solid #a9d6dd}
.ver-banner .link{border:0;background:transparent;color:var(--teal);text-decoration:underline;cursor:pointer;font-size:12px;padding:0}
.ver-banner .x{border:0;background:transparent;color:inherit;cursor:pointer;display:grid;place-items:center;padding:0;width:18px;height:18px}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(20,28,40,.38);display:grid;place-items:center;padding:20px}
.modal{width:min(780px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(20,28,40,.3);overflow:hidden}
.modal.sm{width:min(460px,100%)}
.modal-head{padding:14px 18px;border-bottom:1px solid #edf1f5;display:flex;align-items:center;gap:10px}
.modal-head h2{font-size:15px;font-weight:700}
.modal-head .sub{font-size:12px;color:var(--muted)}
.modal-close{margin-left:auto;width:28px;height:28px;border:0;background:transparent;border-radius:6px;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.modal-close:hover{background:#f1f5f9;color:var(--ink)}
.modal-body{padding:16px 18px;overflow:auto}
.modal-foot{padding:12px 18px;border-top:1px solid #edf1f5;display:flex;justify-content:flex-end;gap:8px;align-items:center}
.modal-foot .err{margin-right:auto;font-size:12px;color:var(--danger)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.form-item label{display:block;font-size:12px;font-weight:600;margin-bottom:4px}
.form-item .req{color:var(--danger);margin-left:2px}
.form-item .desc{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}
.form-item select,.form-item input{width:100%;height:32px;border:1px solid var(--line-strong);border-radius:6px;padding:0 8px;background:#fff;font-size:13px}
.preview{margin-top:16px}
.preview h3{font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
.preview-scroll{overflow:auto;border:1px solid #e3e9ef;border-radius:8px;max-height:210px}
.preview table{border-collapse:collapse;font-size:12px;width:max-content;min-width:100%}
.preview th,.preview td{padding:6px 10px;border-bottom:1px solid #eef2f6;text-align:left;white-space:nowrap}
.preview th{background:#f6f8fa;position:sticky;top:0;font-weight:600}
.preview th.on-primary{background:#e6f4f6;color:var(--teal)}
.preview th.on-parent{background:#eef3fd;color:var(--blue)}
.sort-tools{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.sort-list{list-style:none;display:flex;flex-direction:column;gap:4px}
.sort-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid #e3e9ef;border-radius:6px;background:#fff;font-size:13px;cursor:grab}
.sort-item.drag-over{border-color:var(--blue);box-shadow:0 -2px 0 var(--blue)}
.sort-item.dragging{opacity:.4}
.sort-item .idx{width:22px;color:var(--muted);font-size:12px;text-align:right}
.sort-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sort-item .mv{width:24px;height:24px;border:1px solid var(--line);border-radius:4px;background:#fff;cursor:pointer;display:grid;place-items:center;padding:0;font-size:11px}
.sort-item .mv:disabled{opacity:.3;cursor:default}
.empty{position:absolute;inset:0;display:grid;place-items:center;padding:24px;overflow:auto}
.empty-card{max-width:580px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:28px 32px;text-align:center;transition:border-color 160ms ease,background 160ms ease}
.empty-card.drag-on{border:2px dashed var(--teal);background:#f2fafb}
.empty-card h2{font-size:18px;margin-bottom:8px}
.empty-card p{color:var(--muted);font-size:13px;line-height:1.7}
.empty-card ol{text-align:left;color:var(--muted);font-size:13px;line-height:1.9;margin:12px 0 18px 20px}
.empty-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:rgba(28,37,51,.92);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:200;transition:all 200ms ease;max-width:80vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:rgba(201,42,42,.95)}
.busy{position:fixed;inset:0;z-index:150;display:grid;place-items:center;background:rgba(255,255,255,.55);font-size:13px;color:var(--ink)}
.help-tip{font-size:11px;color:var(--muted);text-align:center;margin-top:5px}
.node-agg{margin-top:4px;padding:2px 6px;border-radius:4px;background:#e8f5f7;color:#0a6b7a;font-size:11px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node-agg+.node-agg{margin-top:2px}
.node-agg .lbl{color:#4b8f99;margin-right:3px}
.agg-section{margin-top:16px;padding-top:14px;border-top:1px solid #edf1f5}
.agg-section>.check{font-weight:600}
.agg-section .desc{font-size:11px;color:var(--muted);font-weight:400;margin-left:4px}
.agg-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.agg-head,.agg-row{display:grid;grid-template-columns:120px minmax(0,1fr) 150px minmax(0,1fr) 28px;gap:8px;align-items:start}
.agg-head{font-size:11px;color:var(--muted);font-weight:600}
.agg-row select,.agg-row input{width:100%;height:30px;border:1px solid var(--line-strong);border-radius:6px;padding:0 6px;background:#fff;font-size:12px}
.agg-hint{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.agg-hint.warn{color:var(--danger)}
.agg-del{width:28px;height:30px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0}
.agg-del:hover{border-color:var(--danger);color:var(--danger)}
.agg-add{align-self:flex-start}
</style>
</head>
<body>
<div id="boot" class="boot">正在加载…</div>
<div id="root"></div>
<!-- 烘焙数据注入点：scripts/bake_data.py 会替换下一行的 null；手工使用时保持 null 即可 -->

<script id="core-src">
/* ================================================================
 * OrgCore：与 UI 无关的纯逻辑（零依赖 PPTX 内核 + PPT 布局 + 构树/字段工具）
 * 不依赖 React，可在 Node 中单独加载测试。
 * ================================================================ */
var OrgCore = (function () {
  'use strict';
  /* ---------- 零依赖 PPTX 内核（OOXML + ZIP Store），移植自 OrgChart.jsx ---------- */
  const _EMU = 914400;
  const _XMLNS_A = 'http://schemas.openxmlformats.org/drawingml/2006/main';
  const _XMLNS_R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const _XMLNS_P = 'http://schemas.openxmlformats.org/presentationml/2006/main';
  const _REL_PACKAGE = 'http://schemas.openxmlformats.org/package/2006/relationships';
  const _REL_CT = 'http://schemas.openxmlformats.org/package/2006/content-types';
  const _REL_OFFICE = _XMLNS_R + '/officeDocument';
  const _REL_SLIDE = _XMLNS_R + '/slide';
  const _REL_MASTER = _XMLNS_R + '/slideMaster';
  const _REL_LAYOUT = _XMLNS_R + '/slideLayout';
  const _REL_THEME = _XMLNS_R + '/theme';
  const MIME_PPTX = 'application/vnd.openxmlformats-officedocument.presentationml.presentation';
  const _PPT_FONT = 'Microsoft YaHei';
  // PPT 配色（hex，无 #）
  const _PPT_BG = 'F4F6FA', _LINE_C = '8E959E', _CARD_BORDER = 'E2E8F0';
  const _ROOT_BORDER = '000000', _ROOT_FILL = 'FFFFFF';
  const _L2_FILL = 'D9D9D9', _L2_BORDER = 'BFBFBF';
  const _NAME_COLOR = '000000', _META_COLOR = '4B5563', _TITLE_COLOR = '1E2A38';

  function _escXml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
  }
  function _emu(n) { return Math.round(n * _EMU); }

  const _CRC_TABLE = (function () {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function _crc32(bytes) {
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) crc = _CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  // 手写 ZIP（STORE 不压缩）：本地文件头 + 中央目录 + 目录结束记录
  function _zipStore(files) {
    const enc = new TextEncoder();
    const chunks = [];
    const central = [];
    let offset = 0;
    const alloc = (size) => { const buf = new Uint8Array(size); chunks.push(buf); return new DataView(buf.buffer); };
    for (const f of files) {
      const name = enc.encode(f.name);
      const crc = _crc32(f.data);
      const h = alloc(30);
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0, true);
      h.setUint16(8, 0, true); h.setUint16(10, 0, true); h.setUint16(12, 0x21, true);
      h.setUint32(14, crc, true); h.setUint32(18, f.data.length, true); h.setUint32(22, f.data.length, true);
      h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
      chunks.push(name, f.data);
      central.push({ name, crc, size: f.data.length, offset });
      offset += 30 + name.length + f.data.length;
    }
    const cdStart = offset;
    for (const c of central) {
      const h = alloc(46);
      h.setUint32(0, 0x02014b50, true); h.setUint16(4, 20, true); h.setUint16(6, 20, true);
      h.setUint16(8, 0, true); h.setUint16(10, 0, true); h.setUint16(12, 0, true); h.setUint16(14, 0x21, true);
      h.setUint32(16, c.crc, true); h.setUint32(20, c.size, true); h.setUint32(24, c.size, true);
      h.setUint16(28, c.name.length, true); h.setUint16(30, 0, true); h.setUint16(32, 0, true);
      h.setUint16(34, 0, true); h.setUint16(36, 0, true); h.setUint32(38, 0, true); h.setUint32(42, c.offset, true);
      chunks.push(c.name);
      offset += 46 + c.name.length;
    }
    const eocd = alloc(22);
    eocd.setUint32(0, 0x06054b50, true); eocd.setUint16(4, 0, true); eocd.setUint16(6, 0, true);
    eocd.setUint16(8, central.length, true); eocd.setUint16(10, central.length, true);
    eocd.setUint32(12, offset - cdStart, true); eocd.setUint32(16, cdStart, true); eocd.setUint16(20, 0, true);
    let total = 0;
    for (const c of chunks) total += c.length;
    const out = new Uint8Array(total);
    let p = 0;
    for (const c of chunks) { out.set(c, p); p += c.length; }
    return out;
  }

  // 文本框 / 椭圆 / 矩形（含"整卡多段文字"）形状
  function _shapeXml(s, id) {
    const W = _emu(s.w || 0), H = _emu(s.h || 0);
    const X = _emu(s.x || 0), Y = _emu(s.y || 0);
    if (s.t === 'text') {
      const anchor = ({ ctr: 'ctr', middle: 'ctr', top: 't', bottom: 'b' })[s.valign] || 'ctr';
      const algn = ({ ctr: 'ctr', center: 'ctr', left: 'l', right: 'r', l: 'l', r: 'r' })[s.align] || 'l';
      const sz = Math.round((s.size || 8) * 100);
      const bold = s.bold ? ' b="1"' : '';
      const color = s.color || '000000';
      const font = _escXml(s.font || _PPT_FONT);
      const paras = (s.lines || []).map(line =>
        `<a:p><a:pPr algn="${algn}"/><a:r><a:rPr lang="zh-CN" sz="${sz}"${bold} dirty="0">` +
        `<a:solidFill><a:srgbClr val="${color}"/></a:solidFill>` +
        `<a:latin typeface="${font}"/><a:ea typeface="${font}"/></a:rPr>` +
        `<a:t>${_escXml(line)}</a:t></a:r></a:p>`
      ).join('');
      return `<p:sp><p:nvSpPr><p:cNvPr id="${id}" name="tx${id}"/><p:cNvSpPr/><p:nvPr/></p:nvSpPr>` +
        `<p:spPr><a:xfrm><a:off x="${X}" y="${Y}"/><a:ext cx="${W}" cy="${H}"/></a:xfrm>` +
        `<a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:noFill/><a:ln><a:noFill/></a:ln></p:spPr>` +
        `<p:txBody><a:bodyPr rtlCol="0" wrap="square" anchor="${anchor}"/><a:lstStyle/>${paras}</p:txBody></p:sp>`;
    }
    const prst = s.radius ? 'roundRect' : 'rect';
    const av = s.radius
      ? `<a:avLst><a:gd name="adj" fmla="val ${Math.max(0, Math.min(50000, Math.round((s.radius / Math.min(s.w || 1, s.h || 1)) * 100000)))}"/></a:avLst>`
      : '<a:avLst/>';
    const fill = s.fill ? `<a:solidFill><a:srgbClr val="${s.fill}"/></a:solidFill>` : '<a:noFill/>';
    const ln = s.line
      ? `<a:ln w="${Math.round((s.line.width || 1) * 12700)}">${s.line.dash ? '<a:prstDash val="sysDash"/>' : ''}<a:solidFill><a:srgbClr val="${s.line.color}"/></a:solidFill></a:ln>`
      : '<a:ln w="0"><a:noFill/></a:ln>';
    const font = _escXml(s.font || _PPT_FONT);
    const txBody = s.paras
      ? `<p:txBody><a:bodyPr rtlCol="0" wrap="square" lIns="${s.lIns || 27432}" rIns="${s.rIns || 27432}" tIns="${s.tIns || 18288}" bIns="${s.bIns || 18288}" anchor="${s.vAnchor || 't'}"/><a:lstStyle/>` +
        s.paras.map(p => {
          const algn = p.align === 'l' ? 'l' : p.align === 'r' ? 'r' : 'ctr';
          const spcBef = p.spcBef ? `<a:spcBef><a:spcPts val="${Math.round(p.spcBef * 100)}"/></a:spcBef>` : '';
          const runs = (p.runs || [{ text: p.text, color: p.color, bold: p.bold, size: p.size }]).map(r => {
            const rsz = Math.round((r.size || p.size || 8) * 100);
            const rbold = r.bold ? ' b="1"' : '';
            // solidFill 必须排在 latin/ea 之前，否则 WPS/PowerPoint 会忽略字体颜色
            return `<a:r><a:rPr lang="zh-CN" sz="${rsz}"${rbold} dirty="0">` +
              `<a:solidFill><a:srgbClr val="${r.color || _NAME_COLOR}"/></a:solidFill>` +
              `<a:latin typeface="${font}"/><a:ea typeface="${font}"/></a:rPr>` +
              `<a:t>${_escXml(r.text == null ? '' : r.text)}</a:t></a:r>`;
          }).join('');
          return `<a:p><a:pPr algn="${algn}">${spcBef}</a:pPr>${runs}</a:p>`;
        }).join('') + `</p:txBody>`
      : '';
    return `<p:sp><p:nvSpPr><p:cNvPr id="${id}" name="shp${id}"/><p:cNvSpPr/><p:nvPr/></p:nvSpPr>` +
      `<p:spPr><a:xfrm><a:off x="${X}" y="${Y}"/><a:ext cx="${W}" cy="${H}"/></a:xfrm>` +
      `<a:prstGeom prst="${prst}">${av}</a:prstGeom>${fill}${ln}</p:spPr>${txBody}</p:sp>`;
  }

  /* 端到端连接符：p:cxnSp + a:stCxn/a:endCxn（框到框吸附），矩形连接点 0=顶 1=左 2=底 3=右
   * kind='bus' ：父卡底 → 子卡顶，bentConnector4（竖直引出 → 水平母线 → 竖直落下）
   * kind='rail'：隐形锚点底 → 子卡左，bentConnector3（同列竖直段重合成左侧导轨） */
  function _connXml(s, id) {
    const sx = s.x1, sy = s.y1, ex = s.x2, ey = s.y2;
    const off = { x: Math.min(sx, ex), y: Math.min(sy, ey) };
    const ext = { w: Math.abs(ex - sx), h: Math.abs(ey - sy) };
    let xfrmAttr = '', geom;
    const We = Math.round(ext.w * _EMU), He = Math.round(ext.h * _EMU);
    const line = '<a:prstGeom prst="line"><a:avLst/></a:prstGeom>';
    if (s.kind === 'rail') {
      if (We < 100) { geom = line; if (ey < sy) xfrmAttr = ' flipV="1"'; }
      else if (He < 100) { geom = line; if (ex < sx) xfrmAttr = ' flipH="1"'; }
      else {
        if (ex < sx) xfrmAttr = ' flipH="1"';
        geom = '<a:prstGeom prst="bentConnector3"><a:avLst><a:gd name="adj1" fmla="val 0"/></a:avLst></a:prstGeom>';
      }
    } else if (We < 100) {
      geom = line; if (ey < sy) xfrmAttr = ' flipV="1"';
    } else {
      if (ex < sx) xfrmAttr = ' flipH="1"';
      const adj2 = s.adj2 !== undefined ? s.adj2 : 50000;
      geom = `<a:prstGeom prst="bentConnector4"><a:avLst><a:gd name="adj1" fmla="val 0"/><a:gd name="adj2" fmla="val ${adj2}"/></a:avLst></a:prstGeom>`;
    }
    return `<p:cxnSp><p:nvCxnSpPr><p:cNvPr id="${id}" name="conn${id}"/>` +
      `<p:cNvCxnSpPr><a:stCxn id="${s.stId}" idx="${s.stIdx}"/><a:endCxn id="${s.endId}" idx="${s.endIdx}"/></p:cNvCxnSpPr><p:nvPr/></p:nvCxnSpPr>` +
      `<p:spPr><a:xfrm${xfrmAttr}><a:off x="${_emu(off.x)}" y="${_emu(off.y)}"/>` +
      `<a:ext cx="${_emu(ext.w)}" cy="${_emu(ext.h)}"/></a:xfrm>${geom}` +
      `<a:ln w="${Math.round((s.width || 0.75) * 12700)}"><a:solidFill><a:srgbClr val="${s.color || _LINE_C}"/></a:solidFill></a:ln>` +
      `</p:spPr></p:cxnSp>`;
  }
  // 生成单页 .pptx 的全部 OOXML 部件并打包为 ZIP
  function _buildPptxFile({ width, height, bg, shapes }) {
    const enc = new TextEncoder();
    const W = _emu(width), H = _emu(height);
    const xmlHead = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
    const ns = `xmlns:a="${_XMLNS_A}" xmlns:r="${_XMLNS_R}" xmlns:p="${_XMLNS_P}"`;
    const spTree = (inner) =>
      `<p:spTree><p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>` +
      `<p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${W}" cy="${H}"/><a:chOff x="0" y="0"/><a:chExt cx="${W}" cy="${H}"/></a:xfrm></p:grpSpPr>${inner}</p:spTree>`;
    const slideXml = xmlHead + `<p:sld ${ns}><p:cSld>` +
      `<p:bg><p:bgPr><a:solidFill><a:srgbClr val="${bg}"/></a:solidFill><a:effectLst/></p:bgPr></p:bg>` +
      spTree(shapes.map((s, i) => (s.t === 'conn' ? _connXml : _shapeXml)(s, s.__id || i + 2)).join('')) +
      `</p:cSld><p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr></p:sld>`;
    const emptyTree = spTree('');
    const masterXml = xmlHead + `<p:sldMaster ${ns}><p:cSld>` +
      `<p:bg><p:bgRef idx="1001"><a:schemeClr val="bg1"/></p:bgRef></p:bg>${emptyTree}</p:cSld>` +
      `<p:clrMap bg1="lt1" tx1="dk1" bg2="lt2" tx2="dk2" accent1="accent1" accent2="accent2" accent3="accent3" accent4="accent4" accent5="accent5" accent6="accent6" hlink="hlink" folHlink="folHlink"/>` +
      `<p:sldLayoutIdLst><p:sldLayoutId id="2147483649" r:id="rId1"/></p:sldLayoutIdLst>` +
      `<p:txStyles><p:titleStyle><a:lvl1pPr algn="ctr"/></p:titleStyle><p:bodyStyle><a:lvl1pPr/></p:bodyStyle>` +
      `<p:otherStyle><a:lvl1pPr/></p:otherStyle></p:txStyles></p:sldMaster>`;
    const layoutXml = xmlHead + `<p:sldLayout ${ns}><p:cSld>${emptyTree}</p:cSld>` +
      `<p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr></p:sldLayout>`;
    const solid3 = '<a:solidFill><a:schemeClr val="phClr"/></a:solidFill>'.repeat(3);
    const themeXml = xmlHead + `<a:theme xmlns:a="${_XMLNS_A}" name="Theme1"><a:themeElements><a:clrScheme name="Office">` +
      `<a:dk1><a:sysClr val="windowText" lastClr="000000"/></a:dk1><a:lt1><a:sysClr val="window" lastClr="FFFFFF"/></a:lt1>` +
      `<a:dk2><a:srgbClr val="44546A"/></a:dk2><a:lt2><a:srgbClr val="E7E6E6"/></a:lt2>` +
      `<a:accent1><a:srgbClr val="4472C4"/></a:accent1><a:accent2><a:srgbClr val="ED7D31"/></a:accent2>` +
      `<a:accent3><a:srgbClr val="A5A5A5"/></a:accent3><a:accent4><a:srgbClr val="FFC000"/></a:accent4>` +
      `<a:accent5><a:srgbClr val="5B9BD5"/></a:accent5><a:accent6><a:srgbClr val="70AD47"/></a:accent6>` +
      `<a:hlink><a:srgbClr val="0563C1"/></a:hlink><a:folHlink><a:srgbClr val="954F72"/></a:folHlink>` +
      `</a:clrScheme><a:fontScheme name="Office">` +
      `<a:majorFont><a:latin typeface="Calibri Light"/><a:ea typeface=""/><a:cs typeface=""/></a:majorFont>` +
      `<a:minorFont><a:latin typeface="Calibri"/><a:ea typeface=""/><a:cs typeface=""/></a:minorFont>` +
      `</a:fontScheme><a:fmtScheme name="Office"><a:fillStyleLst>${solid3}</a:fillStyleLst>` +
      `<a:lnStyleLst><a:ln w="6350" cap="flat"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln>` +
      `<a:ln w="12700" cap="flat"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln>` +
      `<a:ln w="19050" cap="flat"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln></a:lnStyleLst>` +
      `<a:effectStyleLst>${'<a:effectStyle><a:effectLst/></a:effectStyle>'.repeat(3)}</a:effectStyleLst>` +
      `<a:bgFillStyleLst>${solid3}</a:bgFillStyleLst></a:fmtScheme></a:themeElements></a:theme>`;
    const presXml = xmlHead + `<p:presentation ${ns}>` +
      `<p:sldMasterIdLst><p:sldMasterId id="2147483648" r:id="rId1"/></p:sldMasterIdLst>` +
      `<p:sldIdLst><p:sldId id="256" r:id="rId2"/></p:sldIdLst>` +
      `<p:sldSz cx="${W}" cy="${H}"/><p:notesSz cx="6858000" cy="9144000"/></p:presentation>`;
    const rels = (items) => xmlHead + `<Relationships xmlns="${_REL_PACKAGE}">` +
      items.map(([id, type, target]) => `<Relationship Id="${id}" Type="${type}" Target="${target}"/>`).join('') + `</Relationships>`;
    const ct = 'application/vnd.openxmlformats-officedocument.presentationml.';
    const contentTypes = xmlHead + `<Types xmlns="${_REL_CT}">` +
      `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>` +
      `<Default Extension="xml" ContentType="application/xml"/>` +
      `<Override PartName="/ppt/presentation.xml" ContentType="${ct}presentation.main+xml"/>` +
      `<Override PartName="/ppt/slides/slide1.xml" ContentType="${ct}slide+xml"/>` +
      `<Override PartName="/ppt/slideMasters/slideMaster1.xml" ContentType="${ct}slideMaster+xml"/>` +
      `<Override PartName="/ppt/slideLayouts/slideLayout1.xml" ContentType="${ct}slideLayout+xml"/>` +
      `<Override PartName="/ppt/theme/theme1.xml" ContentType="application/vnd.openxmlformats-officedocument.theme+xml"/></Types>`;
    return _zipStore([
      { name: '[Content_Types].xml', data: enc.encode(contentTypes) },
      { name: '_rels/.rels', data: enc.encode(rels([['rId1', _REL_OFFICE, 'ppt/presentation.xml']])) },
      { name: 'ppt/presentation.xml', data: enc.encode(presXml) },
      { name: 'ppt/_rels/presentation.xml.rels', data: enc.encode(rels([['rId1', _REL_MASTER, 'slideMasters/slideMaster1.xml'], ['rId2', _REL_SLIDE, 'slides/slide1.xml']])) },
      { name: 'ppt/slides/slide1.xml', data: enc.encode(slideXml) },
      { name: 'ppt/slides/_rels/slide1.xml.rels', data: enc.encode(rels([['rId1', _REL_LAYOUT, '../slideLayouts/slideLayout1.xml']])) },
      { name: 'ppt/slideMasters/slideMaster1.xml', data: enc.encode(masterXml) },
      { name: 'ppt/slideMasters/_rels/slideMaster1.xml.rels', data: enc.encode(rels([['rId1', _REL_LAYOUT, '../slideLayouts/slideLayout1.xml']])) },
      { name: 'ppt/slideLayouts/slideLayout1.xml', data: enc.encode(layoutXml) },
      { name: 'ppt/slideLayouts/_rels/slideLayout1.xml.rels', data: enc.encode(rels([['rId1', _REL_MASTER, '../slideMasters/slideMaster1.xml'], ['rId2', _REL_THEME, '../theme/theme1.xml']])) },
      { name: 'ppt/theme/theme1.xml', data: enc.encode(themeXml) },
    ]);
  }

  /* ---------- PPT 布局引擎（导轨/母线版，单位英寸） ----------
   * 根卡居中；第 2 层横排，经共用水平母线连到根；第 3 层起在父卡下竖直堆叠，
   * 由父卡内隐形锚点引出左侧导轨；第 2 层子节点 > 6 时分两列、每列一条导轨。 */
  function _estTextW(text, sizePt) {
    let w = 0;
    for (const ch of String(text || '')) w += ch.charCodeAt(0) > 255 ? 1 : 0.6;
    return w * (sizePt / 72);
  }

  function buildPptLayout(org, opts) {
    opts = opts || {};
    const SLIDE_W = 13.333, SLIDE_H = 7.5;
    if (!org) return { width: SLIDE_W, height: SLIDE_H, bg: _PPT_BG, shapes: [] };
    const shapes = [];
    let idSeq = 2;
    const addShape = (s) => { s.__id = idSeq++; shapes.push(s); return s; };
    const drawConn = (fromSh, toSh, busY) => {
      const sx = fromSh.x + fromSh.w / 2, sy = fromSh.y + fromSh.h;
      const ex = toSh.x + toSh.w / 2, ey = toSh.y;
      const span = ey - sy;
      const adj2 = span > 0 ? Math.max(0, Math.min(100000, Math.round(((busY - sy) / span) * 100000))) : 40000;
      addShape({ t: 'conn', kind: 'bus', adj2, x1: sx, y1: sy, x2: ex, y2: ey,
        stId: fromSh.__id, stIdx: 2, endId: toSh.__id, endIdx: 0, color: _LINE_C, width: 0.75 });
    };
    const drawRail = (anchor, toSh) => {
      const sx = anchor.x + anchor.w / 2, sy = anchor.y + anchor.h;
      const ex = toSh.x, ey = toSh.y + toSh.h / 2;
      addShape({ t: 'conn', kind: 'rail', x1: sx, y1: sy, x2: ex, y2: ey,
        stId: anchor.__id, stIdx: 2, endId: toSh.__id, endIdx: 1, color: _LINE_C, width: 0.75 });
    };
    // 隐形锚点：藏在父卡内、底边与父卡底边重合，用于在父卡底边任意 x 处承载连接点
    const ANCHOR_S = 0.03;
    const railAnchorAt = (card, relX) => addShape({ t: 'rect', x: card.x + relX - ANCHOR_S / 2,
      y: card.y + card.h - ANCHOR_S, w: ANCHOR_S, h: ANCHOR_S, fill: null, line: null, radius: 0 });

    const SZ_NAME = 8, SZ_META = 7;
    const LINE_H = (pt) => (pt / 72) * 1.62;
    const NAME_H = LINE_H(SZ_NAME), META_H = LINE_H(SZ_META), META_SPC = 1.5 / 72;
    const PAD_TOP = 0.05, PAD_BOT = 0.04, PAD_X = 0.05;
    const GAP_X_L2 = 0.26, RAIL_OFF = 0.10, RAIL_GAP = 0.14, GAP_Y = 0.06;
    const CONN_H_L1_L2 = 0.24, CONN_H_L2_L3 = 0.16, CONN_H_DEEP = 0.12;
    const TWO_COL_MIN = 6, COL_GAP = 0.34;
    const ALLOW = 2 * PAD_X + 0.12;
    const level2 = org.children || [];
    const deep = [];
    const collect = (n) => (n.children || []).forEach(k => { deep.push(k); collect(k); });
    level2.forEach(collect);
    const maxOf = (arr) => arr.reduce((m, v) => (v > m ? v : m), 0);
    const textW = (n) => maxOf([_estTextW(n.name, SZ_NAME), ...(n.metas || []).map(m => _estTextW(m, SZ_META))]);
    // 卡宽自适应：深层卡统一宽度，第 2 层与根不窄于深层
    const L3_W = Math.max(1.16, Math.min(1.80, maxOf(deep.map(textW)) + ALLOW));
    const L2_W = Math.max(L3_W, Math.min(2.6, maxOf(level2.map(textW)) + ALLOW));
    const L1_W = Math.max(L2_W, Math.min(3.2, textW(org) + ALLOW));

    // 所有卡片统一高度：按最多的名称行数 + 字段行数计算
    const wrapLines = (text, size, cardW) => Math.max(1, Math.ceil(_estTextW(text, size) * 1.06 / ((cardW - 2 * PAD_X) * 0.92)));
    let maxNameLines = 1, maxMetaLines = 0;

        </button>
      )}
    </div>
  );
}

function TreeBranch({ node, depth, isRoot, isInCompactLane }) {
  const ctx = React.useContext(TreeCtx);
  const hasChildren = node.children.length > 0;
  const isCollapsed = ctx.view.collapsed.has(node.id);
  const exceed = ctx.view.maxDepth != null && depth + 1 > ctx.view.maxDepth;
  const manually = ctx.view.expanded.has(node.id);
  const showChildren = hasChildren && !isCollapsed && (!exceed || manually);
  const hiddenCount = exceed && hasChildren && !manually && !isCollapsed ? node.children.length : 0;
  let isVertical = isInCompactLane || depth >= 1;          // 第 2 层起默认纵向收纳
  if (!isInCompactLane && ctx.layoutOverrides[node.id]) isVertical = ctx.layoutOverrides[node.id] === 'vertical';
  const layoutMode = isVertical ? 'vertical' : 'horizontal';
  const kids = showChildren ? C.orderChildren(node, ctx.view.sortOrder) : [];
  const card = <NodeCard node={node} depth={depth} isRoot={isRoot} hasChildren={hasChildren} hiddenCount={hiddenCount}
    isCollapsed={isCollapsed} layoutMode={layoutMode} isInCompactLane={isInCompactLane} />;
  if (isVertical && showChildren) {
    const twoCols = !isInCompactLane && kids.length > TWO_COL_THRESHOLD;
    return (
      <li>
        {card}
        <div className={`compact-lane ${twoCols ? 'compact-two-cols' : ''}`} role="group">
          {kids.map(k => <TreeBranch key={k.id} node={k} depth={depth + 1} isInCompactLane />)}
        </div>
      </li>
    );
  }
  return (
    <li>
      {card}
      {showChildren && (
        <ul role="group">
          {kids.map(k => <TreeBranch key={k.id} node={k} depth={depth + 1} isInCompactLane={isInCompactLane} />)}
        </ul>
      )}
    </li>
  );
}
function Modal({ title, sub, onClose, children, footer, small }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  return (
    <div className="overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className={`modal ${small ? 'sm' : ''}`} role="dialog" aria-modal="true" aria-label={title}>
        <div className="modal-head">
          <h2>{title}</h2>{sub && <span className="sub">{sub}</span>}
          <button type="button" className="modal-close" onClick={onClose} aria-label="关闭"><Icon name="x" /></button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}

function mappingError(map, headers) {
  if (!map.primary) return '请选择主字段';
  if (!map.parent) return '请选择上级字段（决定上下节点关系）';
  if (map.primary === map.parent) return '主字段与上级字段不能是同一列';
  if ((map.id || map.primary) === map.parent) return '节点标识列与上级字段不能是同一列';
  const missing = Object.values(map).filter(v => v && !headers.includes(v));
  if (missing.length) return `表中不存在列：${missing.join('、')}`;
  return '';
}

  return (
    <div className="agg-section">

function SortModal({ node, order, onCancel, onConfirm }) {
  const [list, setList] = useState(() => C.orderChildren(node, { [node.id]: order }).map(c => ({ id: c.id, name: c.name })));
  const [dragIdx, setDragIdx] = useState(-1);
  const [overIdx, setOverIdx] = useState(-1);
  const move = (from, to) => setList(l => {
    if (to < 0 || to >= l.length || from === to) return l;
    const next = l.slice(); const [it] = next.splice(from, 1); next.splice(to, 0, it); return next;
  });
  return (
    <Modal small title="调整子节点顺序" sub={`${node.name} · ${list.length} 个下级`} onClose={onCancel}
      footer={<>
        <button type="button" className="btn ghost lg" onClick={onCancel}>取消</button>
        <button type="button" className="btn primary lg" onClick={() => onConfirm(list.map(x => x.id))}>确定</button>
      </>}>
      <div className="sort-tools">
        <button type="button" className="btn ghost" onClick={() => setList(l => l.slice().sort((a, b) => a.name.localeCompare(b.name, 'zh-CN')))}>按名称排序</button>
        <button type="button" className="btn ghost" onClick={() => setList(node.children.map(c => ({ id: c.id, name: c.name })))}>恢复原始顺序</button>
      </div>
      <ul className="sort-list">
        {list.map((it, i) => (
          <li key={it.id} draggable
            className={`sort-item ${dragIdx === i ? 'dragging' : ''} ${overIdx === i && dragIdx !== i ? 'drag-over' : ''}`}
            onDragStart={(e) => { setDragIdx(i); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(i)); }}
            onDragOver={(e) => { e.preventDefault(); setOverIdx(i); }}
            onDrop={(e) => { e.preventDefault(); move(dragIdx, i); setDragIdx(-1); setOverIdx(-1); }}
            onDragEnd={() => { setDragIdx(-1); setOverIdx(-1); }}>
            <Icon name="grip" />
            <span className="idx">{i + 1}</span>
            <span className="nm" title={it.name}>{it.name}</span>
            <button type="button" className="mv" disabled={i === 0} onClick={() => move(i, i - 1)} aria-label={`上移 ${it.name}`}>↑</button>
            <button type="button" className="mv" disabled={i === list.length - 1} onClick={() => move(i, i + 1)} aria-label={`下移 ${it.name}`}>↓</button>
          </li>
        ))}
      </ul>
    </Modal>
  );
}

function resolveDisplay(headers, map, cfg) {
  cfg = cfg || {};
  let visibleFields;
  if (Array.isArray(cfg.visibleFields)) visibleFields = cfg.visibleFields;
  else if (Array.isArray(cfg.hiddenFields)) {
    const hide = new Set(cfg.hiddenFields.concat([map.primary]));
    visibleFields = headers.filter(h => !hide.has(h));
  } else visibleFields = C.defaultVisibleFields(headers, map);
  return {
    visibleFields: headers.filter(h => h !== map.primary && visibleFields.includes(h)),
    showLabels: !!cfg.showLabels,
    showLayoutToggle: cfg.showLayoutToggle !== false,
    showButtons: cfg.showButtons !== false,
    showAggregates: cfg.showAggregates !== false,
  };
}
